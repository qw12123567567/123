services:
  - type: web
    name: device-ledger
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./deployment/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: off
    disk:
      name: ledger-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
      - key: TZ
        value: Asia/Shanghai
      - key: TRUST_PROXY
        value: 1
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_MFA_SECRET
        sync: false
