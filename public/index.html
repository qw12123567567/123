  <section id="login-view" class="login-view">
    <div class="login-visual">
      <div class="brand-lockup"><img class="brand-logo" src="/zijin-logo.png" alt="紫金矿业集团"></div>
      <div class="login-visual-copy"><span class="eyebrow">新疆紫金黄金</span><h1>新疆紫金黄金<br><span>设备台账</span></h1><p>生产设备、责任归属与全生命周期档案</p></div>
      <div class="visual-board" aria-hidden="true"><div class="visual-row"><span></span><b></b><i></i></div><div class="visual-row"><span></span><b></b><i></i></div><div class="visual-row"><span></span><b></b><i></i></div></div>
      <p class="login-foot">紫金矿业集团 · 设备全生命周期管理</p>
    </div>
    <div class="login-panel">
      <form id="login-form" class="login-form">
        <div><span class="eyebrow">安全运营平台</span><h2>登录设备台账</h2><p>使用分配给你的账号进入系统</p></div>
        <label>账号<input name="username" autocomplete="username" required></label>
        <label>密码<div class="password-wrap"><input name="password" type="password" autocomplete="current-password" required><button type="button" class="plain-button" id="toggle-password">显示</button></div></label>
        <label id="mfa-row">动态验证码<div class="mfa-wrap"><input name="mfaCode" inputmode="numeric" maxlength="6" placeholder="6位验证码"><button type="button" class="plain-button" id="demo-mfa" hidden>获取演示码</button></div></label>
        <button class="button primary login-button" type="submit">安全登录</button>
        <button class="button ghost" type="button" id="forgot-password">忘记密码</button>
        <div class="demo-accounts" hidden><span>演示角色</span><button type="button" data-account="asset">资产管理员</button><button type="button" data-account="dept">部门管理员</button><button type="button" data-account="finance">财务</button><button type="button" data-account="staff">普通员工</button></div>
        <p id="login-error" class="form-error"></p>
      </form>
    </div>
  </section>

  <div id="app-shell" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand"><img class="brand-logo" src="/zijin-logo.png" alt="紫金矿业集团"><span><strong>新疆紫金黄金</strong><small>设备台账</small></span></div>
      <nav id="main-nav" class="main-nav">
        <span class="nav-label">工作台</span>
        <button data-page="dashboard" class="active"><svg><use href="#i-grid"/></svg>首页仪表盘</button>
        <button data-page="devices"><svg><use href="#i-box"/></svg>设备台账</button>
        <button data-page="quick"><svg><use href="#i-search"/></svg>扫码 / 快速查找</button>
        <button data-page="reminders"><svg><use href="#i-bell"/></svg>维保与提醒</button>
        <span class="nav-label admin-nav">管理配置</span>
        <button data-page="departments" class="admin-nav"><svg><use href="#i-building"/></svg>部门管理</button>
        <button data-page="dictionaries" class="admin-nav"><svg><use href="#i-list"/></svg>字典管理</button>
        <button data-page="config" class="admin-nav"><svg><use href="#i-sliders"/></svg>自定义配置</button>
        <button data-page="permissions" class="users-nav"><svg><use href="#i-users"/></svg>用户与权限</button>
        <button data-page="audit" class="audit-nav"><svg><use href="#i-shield"/></svg>审计日志</button>
        <button data-page="settings" class="settings-nav"><svg><use href="#i-settings"/></svg>系统设置</button>
      </nav>
      <div id="sidebar-user" class="sidebar-user"></div>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <button id="mobile-menu" class="icon-button mobile-menu" title="打开菜单"><svg><use href="#i-list"/></svg></button>
        <div class="global-search"><svg><use href="#i-search"/></svg><input id="global-search" placeholder="搜索设备编号、名称、SN、责任人…"><kbd>Enter</kbd></div>
        <div class="top-actions"><span id="scope-badge" class="scope-badge"></span><button id="refresh-page" class="icon-button" title="刷新当前页面"><svg><use href="#i-refresh"/></svg></button><button id="logout-button" class="avatar-button" title="退出登录"><span id="avatar"></span></button></div>
      </header>
      <main id="page-root" class="page-root"></main>
    </section>

  <div id="toast-root" class="toast-root"></div>
